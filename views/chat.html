<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Chat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body class="bg-light">
    <div class="container py-4" style="max-width:980px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="m-0">Room: <span id="roomName"></span></h4>
            <div class="text-muted">User: <span id="userName"></span></div>
        </div>
        <div class="d-flex gap-2">
            <button id="btnLeave" class="btn btn-outline-secondary btn-sm">Leave Room</button>
            <button id="btnLogout" class="btn btn-outline-danger btn-sm">Logout</button>
        </div>
        </div>

        <div class="row g-3">
        <!-- GROUP CHAT -->
        <div class="col-md-7">
            <div class="card shadow-sm">
            <div class="card-header fw-bold">Group Chat</div>

            <div id="messages" class="p-3" style="height:360px; overflow:auto;"></div>

            <div class="border-top p-3">
                <div class="input-group">
                <input id="text" class="form-control" placeholder="Type a room message..." />
                <button id="btnSend" class="btn btn-primary">Send</button>
                </div>
                <div id="sys" class="text-muted mt-2"></div>
            </div>
            </div>
        </div>

        <!-- PRIVATE CHAT -->
        <div class="col-md-5">
            <div class="card shadow-sm">
            <div class="card-header fw-bold">Private Chat</div>

            <div class="p-3">
                <label class="form-label">Send to</label>
                <select id="toUser" class="form-select"></select>
                <div id="typing" class="text-muted mt-2" style="min-height:20px;"></div>
            </div>

            <div id="privateMessages" class="px-3 pb-3" style="height:260px; overflow:auto;"></div>

            <div class="border-top p-3">
                <div class="input-group">
                <input id="privateText" class="form-control" placeholder="Type a private message..." />
                <button id="btnSendPrivate" class="btn btn-success">Send</button>
                </div>
            </div>
            </div>

            <div id="privateSys" class="text-danger mt-2"></div>
        </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/chat.js"></script>
</body>
</html>
