<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Signup</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body class="bg-light">
    <div class="container py-5" style="max-width:520px;">
        <h3 class="mb-3">Create Account</h3>

        <div class="card p-3 shadow-sm">
        <div class="mb-2">
            <label class="form-label">Username</label>
            <input id="username" class="form-control" placeholder="e.g. hetvi123" />
        </div>

        <div class="mb-2">
            <label class="form-label">First Name</label>
            <input id="firstname" class="form-control" placeholder="First name" />
        </div>

        <div class="mb-2">
            <label class="form-label">Last Name</label>
            <input id="lastname" class="form-control" placeholder="Last name" />
        </div>

        <div class="mb-2">
            <label class="form-label">Password</label>
            <input id="password" type="password" class="form-control" placeholder="Password" />
        </div>

        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input id="confirm" type="password" class="form-control" placeholder="Confirm password" />
        </div>

        <button id="btnSignup" class="btn btn-primary w-100">Sign Up</button>
        <div id="msg" class="text-danger mt-2"></div>

        <div class="mt-3 text-center">
            <a href="/views/login.html">Already have an account? Login</a>
        </div>
        </div>
    </div>

    <script src="/js/signup.js"></script>
</body>
</html>
