<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Rooms</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body class="bg-light">
    <div class="container py-5" style="max-width:620px;">
        <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="m-0">Chat Rooms</h3>
        <button id="btnLogout" class="btn btn-outline-danger btn-sm">Logout</button>
        </div>

        <div class="card p-3 shadow-sm">
        <div class="mb-2">
            <div class="text-muted">Logged in as</div>
            <div id="who" class="fw-bold"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Select a room</label>
            <select id="room" class="form-select">
            <option value="devops">devops</option>
            <option value="cloud computing">cloud computing</option>
            <option value="covid19">covid19</option>
            <option value="sports">sports</option>
            <option value="nodeJS">nodeJS</option>
            </select>
        </div>

        <button id="btnJoin" class="btn btn-primary">Join Room</button>
        <div id="msg" class="text-danger mt-2"></div>
        </div>
    </div>

    <script src="/js/rooms.js"></script>
</body>
</html>
